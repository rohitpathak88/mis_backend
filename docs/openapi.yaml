openapi: 3.0.3
info:
  title: MIS Management & Analytics Platform API
  description: Multi-tenant MIS Management & Analytics Platform API.
  version: 1.1.0
servers:
  - url: http://localhost:5001
    description: Local development
  - url: https://vrs.code19msp.com
    description: Unit test server
tags:
  - name: Health
  - name: Authentication
  - name: MIS
  - name: Dashboard
  - name: Users
  - name: Departments
  - name: Teams
  - name: Payout
  - name: Reports
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorResponse:
      type: object
      properties:
        success: {type: boolean, example: false}
        message: {type: string, example: Authentication token required}
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: {type: string, format: email, example: admin@mis.local}
        password: {type: string, format: password, example: Admin@123}
    RegisterOrganizationRequest:
      type: object
      required: [organizationName, adminName, email, password]
      properties:
        organizationName: {type: string, example: ABC Finance Pvt Ltd}
        adminName: {type: string, example: Rohit Sharma}
        email: {type: string, format: email, example: admin@abcfinance.com}
        password: {type: string, format: password, minLength: 8, example: Admin@123}
    AuthUser:
      type: object
      properties:
        id: {type: integer, example: 1}
        name: {type: string, example: Demo Admin}
        email: {type: string, format: email, example: admin@mis.local}
        organizationId: {type: integer, nullable: true, example: 1}
        role: {type: string, example: ORG_ADMIN}
        departmentId: {type: integer, nullable: true, example: 2}
        teamId: {type: integer, nullable: true, example: 5}
    Role:
      type: object
      properties:
        id: {type: integer, example: 5}
        name: {type: string, example: MIS_USER}
        description: {type: string}
    User:
      type: object
      properties:
        id: {type: integer, example: 12}
        name: {type: string, example: MIS Manager}
        email: {type: string, format: email, example: mis.manager@example.com}
        status: {type: string, enum: [ACTIVE, INACTIVE]}
        lastLoginAt: {type: string, format: date-time, nullable: true}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        role: {$ref: '#/components/schemas/Role'}
    CreateUserRequest:
      type: object
      required: [name, email, password, roleId]
      properties:
        name: {type: string}
        email: {type: string, format: email}
        password: {type: string, format: password, minLength: 8}
        roleId: {type: integer}
    UpdateUserRequest:
      type: object
      required: [name, email, roleId]
      properties:
        name: {type: string}
        email: {type: string, format: email}
        roleId: {type: integer}
    UpdateUserStatusRequest:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [ACTIVE, INACTIVE]}
    UpdateUserRoleRequest:
      type: object
      required: [roleId]
      properties:
        roleId: {type: integer}
    UpdateUserPasswordRequest:
      type: object
      required: [password]
      properties:
        password: {type: string, format: password, minLength: 8}
    Department:
      type: object
      properties:
        id: {type: integer}
        name: {type: string}
        organizationId: {type: integer}
        status: {type: string}
    Team:
      type: object
      properties:
        id: {type: integer}
        name: {type: string}
        organizationId: {type: integer}
        departmentId: {type: integer}
        teamLeaderId: {type: integer, nullable: true}
        status: {type: string}
    MISRecord:
      type: object
      properties:
        id: {type: integer}
        customerName: {type: string}
        contactNumber: {type: string}
        employerName: {type: string}
        bankName: {type: string}
        city: {type: string}
        product: {type: string}
        loanAccountNo: {type: string}
        disbursementAmount: {type: number, format: double}
        disbursementMonth: {type: string, format: date}
        sellerName: {type: string}
        teamName: {type: string}
        dsaCode: {type: string}
        cashback: {type: number, format: double}
        subvention: {type: number, format: double}
        importId: {type: integer}
        createdAt: {type: string, format: date-time}
    ImportResult:
      type: object
      properties:
        importId: {type: integer}
        fileName: {type: string}
        reportingMonth: {type: string, format: date}
        totalRows: {type: integer}
        successfulRows: {type: integer}
        failedRows: {type: integer}
        status: {type: string, example: COMPLETED}
    DashboardSummary:
      type: object
      properties:
        totalLoans: {type: integer}
        totalDisbursement: {type: number, format: double}
        averageLoanAmount: {type: number, format: double}
        totalCashback: {type: number, format: double}
        totalSubvention: {type: number, format: double}
        approvedLoans: {type: integer}
        approvedAmount: {type: number, format: double}
    PayoutPeriod:
      type: object
      properties:
        id: {type: integer}
        periodMonth: {type: string, example: 2026-06}
        status: {type: string, enum: [DRAFT, CALCULATED, REVIEWED, APPROVED, PAID, LOCKED]}
        createdAt: {type: string, format: date-time}
        approvedAt: {type: string, format: date-time, nullable: true}
    Payout:
      type: object
      properties:
        id: {type: integer}
        payoutPeriodId: {type: integer}
        teamLeaderId: {type: integer}
        approvedAmount: {type: number, format: double}
        payoutRate: {type: number, format: double}
        payoutAmount: {type: number, format: double}
        status: {type: string}
        paidAt: {type: string, format: date-time, nullable: true}
  parameters:
    OrganizationId:
      name: organizationId
      in: query
      required: false
      description: Required when SUPER_ADMIN is viewing a selected organization.
      schema: {type: integer}
      example: 1
    Id:
      name: id
      in: path
      required: true
      schema: {type: integer}
      example: 1
paths:
  /api/health:
    get:
      tags: [Health]
      summary: Check API and database health
      responses:
        '200': {description: API health status}
  /api/auth/login:
    post:
      tags: [Authentication]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200': {description: Login successful}
        '401': {description: Invalid email or password}
  /api/auth/register:
    post:
      tags: [Authentication]
      summary: Register organization and first ORG_ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterOrganizationRequest'}
      responses:
        '201': {description: Organization registered successfully}
        '400': {description: Invalid request}
        '409': {description: Email already registered}
  /api/auth/me:
    get:
      tags: [Authentication]
      summary: Get current authenticated user
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Current user}
        '401': {description: Unauthorized}
  /api/mis/import:
    post:
      tags: [MIS]
      summary: Import MIS Excel file
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
                reportingMonth: {type: string, format: date, example: '2026-06-01'}
      responses:
        '200': {description: MIS file imported successfully}
        '400': {description: Invalid file or import request}
        '401': {description: Unauthorized}
        '403': {description: Forbidden}
  /api/mis/data:
    get:
      tags: [MIS]
      summary: Get MIS data
      security: [{bearerAuth: []}]
      parameters:
        - {name: month, in: query, schema: {type: string, format: date}}
        - {name: bank, in: query, schema: {type: string}}
        - {name: product, in: query, schema: {type: string}}
        - {name: team, in: query, schema: {type: string}}
        - {name: seller, in: query, schema: {type: string}}
        - {name: city, in: query, schema: {type: string}}
        - {$ref: '#/components/parameters/OrganizationId'}
      responses:
        '200': {description: MIS data retrieved successfully}
        '401': {description: Unauthorized}
        '403': {description: Forbidden}
  /api/mis/months:
    get:
      tags: [MIS]
      summary: Get available MIS months
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/OrganizationId'}]
      responses:
        '200': {description: Available months}
        '401': {description: Unauthorized}
  /api/dashboard:
    get:
      tags: [Dashboard]
      summary: Get dashboard analytics
      security: [{bearerAuth: []}]
      parameters:
        - {name: month, in: query, schema: {type: string, format: date}, example: '2026-06-01'}
        - {$ref: '#/components/parameters/OrganizationId'}
      responses:
        '200': {description: Dashboard data retrieved successfully}
        '400': {description: Organization selection required for SUPER_ADMIN}
        '401': {description: Unauthorized}
        '403': {description: Forbidden}
  /api/users:
    get:
      tags: [Users]
      summary: Get organization users
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Users retrieved successfully}
        '401': {description: Unauthorized}
        '403': {description: Forbidden}
    post:
      tags: [Users]
      summary: Create organization user
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateUserRequest'}
      responses:
        '201': {description: User created successfully}
        '400': {description: Invalid request or email already registered}
        '401': {description: Unauthorized}
        '403': {description: Forbidden}
  /api/users/roles:
    get:
      tags: [Users]
      summary: Get available roles
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Roles retrieved successfully}
        '401': {description: Unauthorized}
        '403': {description: Forbidden}
  /api/users/{id}:
    get:
      tags: [Users]
      summary: Get user by ID
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses:
        '200': {description: User retrieved successfully}
        '401': {description: Unauthorized}
        '403': {description: Forbidden}
        '404': {description: User not found}
    put:
      tags: [Users]
      summary: Update user
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateUserRequest'}
      responses:
        '200': {description: User updated successfully}
        '400': {description: Invalid request}
        '401': {description: Unauthorized}
        '403': {description: Forbidden}
        '404': {description: User not found}
    delete:
      tags: [Users]
      summary: Deactivate user
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses:
        '200': {description: User deactivated successfully}
        '401': {description: Unauthorized}
        '403': {description: Forbidden}
        '404': {description: User not found}
  /api/users/{id}/status:
    patch:
      tags: [Users]
      summary: Update user status
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateUserStatusRequest'}
      responses:
        '200': {description: User status updated successfully}
        '400': {description: Invalid status}
        '401': {description: Unauthorized}
        '403': {description: Forbidden}
        '404': {description: User not found}
  /api/users/{id}/role:
    patch:
      tags: [Users]
      summary: Change user role
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateUserRoleRequest'}
      responses:
        '200': {description: User role updated successfully}
        '400': {description: Invalid role}
        '401': {description: Unauthorized}
        '403': {description: Forbidden}
        '404': {description: User not found}
  /api/users/{id}/password:
    patch:
      tags: [Users]
      summary: Update user password
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateUserPasswordRequest'}
      responses:
        '200': {description: Password updated successfully}
        '400': {description: Invalid password}
        '401': {description: Unauthorized}
        '403': {description: Forbidden}
        '404': {description: User not found}
  /api/departments:
    get:
      tags: [Departments]
      summary: Get organization departments
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/OrganizationId'}]
      responses:
        '200': {description: Departments retrieved successfully}
        '401': {description: Unauthorized}
        '403': {description: Forbidden}
    post:
      tags: [Departments]
      summary: Create department
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, example: Retail Loans}
      responses:
        '201': {description: Department created successfully}
        '400': {description: Invalid request}
        '401': {description: Unauthorized}
        '403': {description: Forbidden}
  /api/departments/{id}:
    put:
      tags: [Departments]
      summary: Update department
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string}
      responses:
        '200': {description: Department updated successfully}
        '401': {description: Unauthorized}
        '403': {description: Forbidden}
        '404': {description: Department not found}
    delete:
      tags: [Departments]
      summary: Deactivate department
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses:
        '200': {description: Department deactivated successfully}
        '401': {description: Unauthorized}
        '403': {description: Forbidden}
        '404': {description: Department not found}
  /api/teams:
    get:
      tags: [Teams]
      summary: Get organization teams
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/OrganizationId'}
        - {name: departmentId, in: query, schema: {type: integer}}
      responses:
        '200': {description: Teams retrieved successfully}
        '401': {description: Unauthorized}
        '403': {description: Forbidden}
    post:
      tags: [Teams]
      summary: Create team
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, departmentId]
              properties:
                name: {type: string, example: North Team}
                departmentId: {type: integer, example: 2}
                teamLeaderId: {type: integer, nullable: true, example: 12}
      responses:
        '201': {description: Team created successfully}
        '400': {description: Invalid request}
        '401': {description: Unauthorized}
        '403': {description: Forbidden}
  /api/teams/{id}:
    put:
      tags: [Teams]
      summary: Update team
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string}
                departmentId: {type: integer}
                teamLeaderId: {type: integer, nullable: true}
      responses:
        '200': {description: Team updated successfully}
        '401': {description: Unauthorized}
        '403': {description: Forbidden}
        '404': {description: Team not found}
    delete:
      tags: [Teams]
      summary: Deactivate team
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses:
        '200': {description: Team deactivated successfully}
        '401': {description: Unauthorized}
        '403': {description: Forbidden}
        '404': {description: Team not found}
  /api/payout/periods:
    get:
      tags: [Payout]
      summary: Get payout periods
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/OrganizationId'}]
      responses:
        '200': {description: Payout periods retrieved successfully}
        '401': {description: Unauthorized}
        '403': {description: Forbidden}
  /api/payout/history:
    get:
      tags: [Payout]
      summary: Get payout history
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/OrganizationId'}
        - {name: teamLeaderId, in: query, schema: {type: integer}}
        - {name: periodMonth, in: query, schema: {type: string, example: 2026-06}}
      responses:
        '200': {description: Payout history retrieved successfully}
        '401': {description: Unauthorized}
        '403': {description: Forbidden}
  /api/payout/periods/{id}/calculate:
    post:
      tags: [Payout]
      summary: Calculate payout period
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses:
        '200': {description: Payout calculated successfully}
        '400': {description: Invalid payout period or state}
        '401': {description: Unauthorized}
        '403': {description: Forbidden}
  /api/payout/periods/{id}/review:
    post:
      tags: [Payout]
      summary: Review payout period
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses:
        '200': {description: Payout period reviewed successfully}
        '401': {description: Unauthorized}
        '403': {description: Forbidden}
  /api/payout/periods/{id}/approve:
    post:
      tags: [Payout]
      summary: Approve payout period
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses:
        '200': {description: Payout period approved successfully}
        '401': {description: Unauthorized}
        '403': {description: Forbidden}
  /api/payout/periods/{id}/pay:
    post:
      tags: [Payout]
      summary: Mark payout period as paid
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses:
        '200': {description: Payout marked as paid}
        '401': {description: Unauthorized}
        '403': {description: Forbidden}
  /api/payout/periods/{id}/lock:
    post:
      tags: [Payout]
      summary: Lock payout period
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/Id'}]
      responses:
        '200': {description: Payout period locked successfully}
        '401': {description: Unauthorized}
        '403': {description: Forbidden}
  /api/reports/summary:
    get:
      tags: [Reports]
      summary: MIS summary report
      security: [{bearerAuth: []}]
      parameters:
        - {name: month, in: query, schema: {type: string, format: date}}
        - {$ref: '#/components/parameters/OrganizationId'}
      responses:
        '200': {description: Summary report retrieved successfully}
        '401': {description: Unauthorized}
        '403': {description: Forbidden}
  /api/reports/disbursement:
    get:
      tags: [Reports]
      summary: Disbursement report
      security: [{bearerAuth: []}]
      parameters:
        - {name: month, in: query, schema: {type: string, format: date}}
        - {name: bank, in: query, schema: {type: string}}
        - {name: product, in: query, schema: {type: string}}
        - {name: team, in: query, schema: {type: string}}
        - {$ref: '#/components/parameters/OrganizationId'}
      responses:
        '200': {description: Disbursement report retrieved successfully}
        '401': {description: Unauthorized}
        '403': {description: Forbidden}
  /api/reports/team-performance:
    get:
      tags: [Reports]
      summary: Team performance report
      security: [{bearerAuth: []}]
      parameters:
        - {name: month, in: query, schema: {type: string, format: date}}
        - {name: teamId, in: query, schema: {type: integer}}
        - {$ref: '#/components/parameters/OrganizationId'}
      responses:
        '200': {description: Team performance report retrieved successfully}
        '401': {description: Unauthorized}
        '403': {description: Forbidden}
  /api/reports/reconciliation:
    get:
      tags: [Reports]
      summary: Approval and reconciliation report
      security: [{bearerAuth: []}]
      parameters:
        - {name: month, in: query, schema: {type: string, format: date}}
        - {name: status, in: query, schema: {type: string, enum: [PENDING, MATCHED, VARIANCE, NOT_FOUND, APPROVED, REJECTED]}}
        - {$ref: '#/components/parameters/OrganizationId'}
      responses:
        '200': {description: Reconciliation report retrieved successfully}
        '401': {description: Unauthorized}
        '403': {description: Forbidden}
  /api/reports/payout:
    get:
      tags: [Reports]
      summary: Payout report
      security: [{bearerAuth: []}]
      parameters:
        - {name: periodMonth, in: query, schema: {type: string, example: 2026-06}}
        - {name: teamLeaderId, in: query, schema: {type: integer}}
        - {$ref: '#/components/parameters/OrganizationId'}
      responses:
        '200': {description: Payout report retrieved successfully}
        '401': {description: Unauthorized}
        '403': {description: Forbidden}
  /api/reports/export:
    get:
      tags: [Reports]
      summary: Export report data
      security: [{bearerAuth: []}]
      parameters:
        - name: report
          in: query
          required: true
          schema:
            type: string
            enum: [summary, disbursement, team-performance, reconciliation, payout]
        - {name: month, in: query, schema: {type: string, format: date}}
        - {$ref: '#/components/parameters/OrganizationId'}
      responses:
        '200': {description: Report exported successfully}
        '400': {description: Invalid report type}
        '401': {description: Unauthorized}
        '403': {description: Forbidden}
